<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cube</title>
  </head>
  <body>
    <!-- index.html -->
  <a-scene fog="type: exponential; color: #111111; density: 0">
  <a-entity gltf-model="./assets/Base.glb" scale="4 1 4"></a-entity>
  <a-entity gltf-model="./assets/control_panels_bulk4k.glb" position="0.00878 -13.47694 -20.20816" rotation="0 180 0" scale="0.5 0.5 0.5"></a-entity>
  <a-entity gltf-model="./assets/Base.glb" scale="4 1 4" position="4 4 0" rotation="0 0 90"></a-entity>
  <a-entity gltf-model="./assets/Base.glb" scale="4 1 4" position="-4 4 0" rotation="0 180 90"></a-entity>
  <a-entity gltf-model="./assets/Base.glb" scale="4 1 4" position="0 4 4" rotation="90 180 0"></a-entity>
  <a-entity gltf-model="./assets/Base.glb" scale="4 1 4" position="0 8 0" rotation="180 0 0"></a-entity>
  <a-entity gltf-model="./assets/fenetre.glb" scale="2.56 3.28 1.95" rotation="0 90 0" position="0 0 -3.90824"></a-entity>
  <!-- Vitre transparente pour fermer le cube ouvert -->
  <a-plane position="0 3.11595 -3.79359" scale="6 8 1" material="opacity: 0.1; transparent: true; color: #ffffff"></a-plane>
  
  <!-- ENVIRONNEMENT 1: Tatooine -->
  <a-entity id="env1" visible="true">
    <!-- Étoiles dans l'espace -->
    <a-entity id="stars">
      <a-sphere position="15 20 -30" radius="0.1" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
      <a-sphere position="-20 15 -25" radius="0.08" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
      <a-sphere position="25 10 -35" radius="0.12" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
      <a-sphere position="-15 25 -20" radius="0.09" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
      <a-sphere position="10 30 -28" radius="0.11" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
      <a-sphere position="-25 8 -32" radius="0.1" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
      <a-sphere position="18 -10 -26" radius="0.09" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
      <a-sphere position="-10 -15 -30" radius="0.08" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
      <a-sphere position="30 18 -22" radius="0.1" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
      <a-sphere position="-18 -8 -27" radius="0.11" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
      <a-sphere position="12 -20 -33" radius="0.09" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
      <a-sphere position="-28 20 -29" radius="0.1" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
      <a-sphere position="22 -5 -31" radius="0.12" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
      <a-sphere position="-12 28 -24" radius="0.08" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
      <a-sphere position="8 12 -34" radius="0.1" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
      <a-sphere position="-22 -18 -25" radius="0.09" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
    </a-entity>
    <!-- Planète Tatooine qui tourne sur elle-même -->
    <a-sphere position="-21.49178 15 -80.5141" radius="8" material="src: ./assets/tatooine.jpg" scale="2 2 2"
      animation="property: rotation; to: 0 360 0; dur: 80000; loop: true; easing: linear"></a-sphere>
    <!-- Soleils avec sources de lumière -->
    <!-- Soleil jaune tournant autour de Tatooine (plus rapide - 100 secondes) -->
    <a-entity position="-21.49178 15 -80.5141"
      animation="property: rotation; to: 0 360 0; dur: 100000; loop: true; easing: linear">
      <a-entity position="-28.50914 15 -7.34341">
        <a-sphere radius="5" color="#ffdd00" material="emissive: #ffdd00; emissiveIntensity: 3" scale="3 3 3"></a-sphere>
        <a-light type="point" intensity="12" distance="300" decay="0.5" color="#ffdd00"></a-light>
      </a-entity>
    </a-entity>
    <!-- Soleil orange tournant autour de Tatooine (plus lent - 150 secondes) -->
    <a-entity position="-21.49178 15 -80.5141"
      animation="property: rotation; to: 0 360 0; dur: 150000; loop: true; easing: linear">
      <a-entity position="47.14893 0 -0.74182">
        <a-sphere radius="4" color="#ff5500" material="emissive: #ff5500; emissiveIntensity: 3" scale="3 3 3"></a-sphere>
        <a-light type="point" intensity="10" distance="280" decay="0.5" color="#ff5500"></a-light>
      </a-entity>
    </a-entity>
  </a-entity>
  
  <!-- ENVIRONNEMENT 2: Nébuleuse bleue -->
  <a-entity id="env2" visible="false">
    <!-- Étoiles différentes -->
    <a-entity id="stars2">
      <a-sphere position="20 15 -35" radius="0.1" color="#aaddff" material="emissive: #aaddff; emissiveIntensity: 2"></a-sphere>
      <a-sphere position="-15 20 -30" radius="0.08" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
      <a-sphere position="30 5 -40" radius="0.12" color="#aaddff" material="emissive: #aaddff; emissiveIntensity: 2"></a-sphere>
      <a-sphere position="-25 18 -25" radius="0.09" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
      <a-sphere position="12 28 -32" radius="0.11" color="#aaddff" material="emissive: #aaddff; emissiveIntensity: 2"></a-sphere>
      <a-sphere position="-30 10 -38" radius="0.1" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
      <a-sphere position="22 -8 -30" radius="0.09" color="#aaddff" material="emissive: #aaddff; emissiveIntensity: 2"></a-sphere>
      <a-sphere position="-18 -12 -35" radius="0.08" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
      <a-sphere position="28 22 -28" radius="0.1" color="#aaddff" material="emissive: #aaddff; emissiveIntensity: 2"></a-sphere>
      <a-sphere position="-22 -5 -32" radius="0.11" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
    </a-entity>
    <!-- Grande nébuleuse bleue/violette -->
    <a-sphere position="0 10 -100" radius="25" material="src: ./assets/Hoth.png" material="color: #2244aa; emissive: #1133aa; emissiveIntensity: 0.5; opacity: 0.6; transparent: true"></a-sphere>
    <!-- Planète glacée -->
    <a-sphere position="25 -10 -70" radius="6" color="#aaccff" material="emissive: #334466; emissiveIntensity: 0.3"></a-sphere>
    <!-- Étoile bleue -->
    <a-entity position="40 30 -90">
      <a-sphere radius="4" color="#4488ff" material="emissive: #4488ff; emissiveIntensity: 3"></a-sphere>
      <a-light type="point" intensity="10" distance="300" decay="0.5" color="#4488ff"></a-light>
    </a-entity>
  </a-entity>
  
  <!-- HYPERESPACE (caché par défaut) -->
  <a-entity id="hyperspace" visible="false">
    <!-- Lignes d'hyperespace avec animations A-Frame natives -->
    <a-cylinder id="hline1" position="-3 4 -40" radius="0.03" height="8" rotation="90 0 0" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 3"
      animation="property: position; to: -3 4 5; dur: 400; loop: true; easing: linear"></a-cylinder>
    <a-cylinder id="hline2" position="2 4 -45" radius="0.03" height="10" rotation="90 0 0" color="#aaddff" material="emissive: #aaddff; emissiveIntensity: 3"
      animation="property: position; to: 2 4 5; dur: 450; loop: true; easing: linear"></a-cylinder>
    <a-cylinder id="hline3" position="-5 4 -50" radius="0.03" height="12" rotation="90 0 0" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 3"
      animation="property: position; to: -5 4 5; dur: 380; loop: true; easing: linear"></a-cylinder>
    <a-cylinder id="hline4" position="4 4 -35" radius="0.03" height="6" rotation="90 0 0" color="#aaddff" material="emissive: #aaddff; emissiveIntensity: 3"
      animation="property: position; to: 4 4 5; dur: 350; loop: true; easing: linear"></a-cylinder>
    <a-cylinder id="hline5" position="0 4 -55" radius="0.03" height="14" rotation="90 0 0" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 3"
      animation="property: position; to: 0 4 5; dur: 500; loop: true; easing: linear"></a-cylinder>
    <a-cylinder id="hline6" position="-2 4 -30" radius="0.03" height="5" rotation="90 0 0" color="#aaddff" material="emissive: #aaddff; emissiveIntensity: 3"
      animation="property: position; to: -2 4 5; dur: 320; loop: true; easing: linear"></a-cylinder>
    <a-cylinder id="hline7" position="5 4 -48" radius="0.03" height="11" rotation="90 0 0" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 3"
      animation="property: position; to: 5 4 5; dur: 420; loop: true; easing: linear"></a-cylinder>
    <a-cylinder id="hline8" position="-4 4 -42" radius="0.03" height="9" rotation="90 0 0" color="#aaddff" material="emissive: #aaddff; emissiveIntensity: 3"
      animation="property: position; to: -4 4 5; dur: 390; loop: true; easing: linear"></a-cylinder>
    <a-cylinder id="hline9" position="3 4 -60" radius="0.03" height="15" rotation="90 0 0" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 3"
      animation="property: position; to: 3 4 5; dur: 550; loop: true; easing: linear"></a-cylinder>
    <a-cylinder id="hline10" position="-1 4 -38" radius="0.03" height="7" rotation="90 0 0" color="#aaddff" material="emissive: #aaddff; emissiveIntensity: 3"
      animation="property: position; to: -1 4 5; dur: 360; loop: true; easing: linear"></a-cylinder>
    <a-cylinder id="hline11" position="1 4 -65" radius="0.03" height="16" rotation="90 0 0" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 3"
      animation="property: position; to: 1 4 5; dur: 600; loop: true; easing: linear"></a-cylinder>
    <a-cylinder id="hline12" position="-6 4 -44" radius="0.03" height="10" rotation="90 0 0" color="#aaddff" material="emissive: #aaddff; emissiveIntensity: 3"
      animation="property: position; to: -6 4 5; dur: 410; loop: true; easing: linear"></a-cylinder>
    <!-- Lignes supplémentaires pour plus de densité -->
    <a-cylinder position="1 6 -52" radius="0.02" height="8" rotation="90 0 0" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 3"
      animation="property: position; to: 1 6 5; dur: 430; loop: true; easing: linear"></a-cylinder>
    <a-cylinder position="-3 2 -47" radius="0.02" height="9" rotation="90 0 0" color="#aaddff" material="emissive: #aaddff; emissiveIntensity: 3"
      animation="property: position; to: -3 2 5; dur: 440; loop: true; easing: linear"></a-cylinder>
    <a-cylinder position="4 7 -55" radius="0.02" height="7" rotation="90 0 0" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 3"
      animation="property: position; to: 4 7 5; dur: 470; loop: true; easing: linear"></a-cylinder>
    <a-cylinder position="-5 1 -50" radius="0.02" height="11" rotation="90 0 0" color="#aaddff" material="emissive: #aaddff; emissiveIntensity: 3"
      animation="property: position; to: -5 1 5; dur: 460; loop: true; easing: linear"></a-cylinder>
  </a-entity>
  
  <a-light id="shipFill" type="ambient" intensity="0.03" color="#ffffff"></a-light>
  
  <a-sky color="#111111"></a-sky>

</a-scene>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
