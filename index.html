<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cube</title>
  </head>
  <body>
    <!-- index.html -->
<a-scene>
  <a-entity gltf-model="assets/base.glb" scale="4 1 4"></a-entity>
  <a-entity gltf-model="assets/base.glb" scale="4 1 4" position="4 4 0" rotation="0 0 90"></a-entity>
  <a-entity gltf-model="assets/base.glb" scale="4 1 4" position="-4 4 0" rotation="0 180 90"></a-entity>
  <a-entity gltf-model="assets/base.glb" scale="4 1 4" position="0 4 4" rotation="90 180 0"></a-entity>
  <a-entity gltf-model="assets/base.glb" scale="4 1 4" position="0 8 0" rotation="180 0 0"></a-entity>
  <a-entity gltf-model="assets/fenetre.glb" scale="2.56 3.28 1.95" rotation="0 90 0" position="0 0 -3.90824"></a-entity>
  <!-- Vitre transparente pour fermer le cube ouvert -->
  <a-plane position="0 3.11595 -3.79359" scale="6 8 1" material="opacity: 0.1; transparent: true; color: #ffffff"></a-plane>
  
  <!-- Étoiles dans l'espace -->
  <a-sphere position="15 20 -30" radius="0.1" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
  <a-sphere position="-20 15 -25" radius="0.08" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
  <a-sphere position="25 10 -35" radius="0.12" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
  <a-sphere position="-15 25 -20" radius="0.09" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
  <a-sphere position="10 30 -28" radius="0.11" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
  <a-sphere position="-25 8 -32" radius="0.1" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
  <a-sphere position="18 -10 -26" radius="0.09" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
  <a-sphere position="-10 -15 -30" radius="0.08" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
  <a-sphere position="30 18 -22" radius="0.1" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
  <a-sphere position="-18 -8 -27" radius="0.11" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
  <a-sphere position="12 -20 -33" radius="0.09" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
  <a-sphere position="-28 20 -29" radius="0.1" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
  <a-sphere position="22 -5 -31" radius="0.12" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
  <a-sphere position="-12 28 -24" radius="0.08" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
  <a-sphere position="8 12 -34" radius="0.1" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
  <a-sphere position="-22 -18 -25" radius="0.09" color="#ffffff" material="emissive: #ffffff; emissiveIntensity: 2"></a-sphere>
  
  <!-- Planète Tatooine -->
  <a-sphere position="-40 15 -60" radius="8" material="src: assets/tatooine.jpg"></a-sphere>
  
  <a-sky color="#111111"></a-sky>

</a-scene>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
